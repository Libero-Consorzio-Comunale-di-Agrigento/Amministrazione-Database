# 01: Configurazione dei parametri di installazione: Codice Istanza, Progetto, Modulo, Componenti. Etc.
# 01.00: Configura la VERSIONE che rappresenta la versione del database su ad4_istanze:
versione=${version}

# configurazioni del Progetto su AD4
progetto.codice=AD4
progetto.descrizione=Progetto AD4
progetto.istanza.codice=AD4
progetto.istanza.descrizione=Amministratore DataBase
progetto.istanza.ente=ENTE
progetto.istanza.lingua=I
# 01.02: Configura il Modulo AD4
# configurazioni del Modulo su Ad4
modulo.codice=AD4
modulo.descrizione=Amministratore DataBase

# 01.03: Configura i Componenti da installare di default
# Eventuali componenti installati di default (una lista separata da ,)
componenti=

# 01.04: configura username/password di default per lo user oracle e per la risorsa jndi
# Valori di default per l'Utente Oracle, Password Oracle, nome risorsa jndi
global.db.target.username=AD4
global.db.target.password=AD4
global.db.target.jndi-name=jdbc/ad4

global.db.si4.username=SI4
global.db.si4.password=SI4
global.db.si4.jndi-name=jdbc/si4

# TODO[01.05]: configura i valori di default per la tablespace
# Valori di default per la tablespace
global.db.target.tablespace.name=AD4
global.db.target.tablespace.size=200

# 01.06: configura il nome del contesto di default
# Nome del contesto di default: (se vuoto, verrà utilizzato il nome del war)
ad4.contextName=ad4web

# Vedi bug installante issue #43432
global.db.ad4.username=AD4
global.db.ad4.password=AD4

